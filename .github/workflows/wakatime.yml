name: WakaTime Readme

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 00:00 UTC 更新
  workflow_dispatch:

jobs:
  update-readme:
    name: Update WakaTime stats in README
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master  # ← 改成 master 或最新版
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          SHOW_TIME: true
